<!DOCTYPE html>
<html lang="en" dir="ltr" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#EEF2F9">
<title>Console — NABRA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E0F11'/%3E%3Cpath d='M16 8a2.6 2.6 0 0 0-2.6 2.6v5.6a2.6 2.6 0 0 0 5.2 0v-5.6A2.6 2.6 0 0 0 16 8z' fill='%23FCFCFB'/%3E%3Cpath d='M21.4 15.6v1a5.4 5.4 0 0 1-10.8 0v-1' stroke='%23B8501C' stroke-width='1.7' fill='none' stroke-linecap='round'/%3E%3Cline x1='16' y1='22' x2='16' y2='24.5' stroke='%23FCFCFB' stroke-width='1.7' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Chivo+Mono:wght@300;400;500&family=Alexandria:wght@300;400;500;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:only light;
  --ink:#163466;
  --ink-deep:#0E2450;
  --on-ink:#EEF3FA;
  --bone:#EEF2F9; --bone-hi:#FFFFFF; --paper:#DEE6F3;
  --fg:#163466; --fg-mute:#4A5F86; --fg-faint:#8394B2;
  --rule:rgba(22,52,102,.115); --rule-soft:rgba(22,52,102,.055);
  --ember:#1E4FD8;
  --ember-mid:#2F6BFF; --ember-wash:rgba(47,107,255,.07);
  --display:'Plus Jakarta Sans',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'Chivo Mono',ui-monospace,monospace;
  --ar-display:'Alexandria',sans-serif;
  --ar-body:'IBM Plex Sans Arabic',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --rail:236px;
}
@media (prefers-color-scheme: dark){
  :root{color-scheme:only light}
  html,body{background:#EEF2F9 !important;color:#163466 !important}
}
*{box-sizing:border-box;margin:0;padding:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
html{background:#EEF2F9;color-scheme:only light}
body{background:var(--bone);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
html[dir="rtl"] body{font-family:var(--ar-body)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}

.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);font-size:.58rem;letter-spacing:.17em;text-transform:uppercase;color:var(--fg-faint)}
html[dir="rtl"] .lbl{font-family:var(--ar-body);letter-spacing:0;text-transform:none;font-size:.72rem}
.ser{font-family:var(--display);font-weight:700;letter-spacing:-.025em;letter-spacing:-.01em}
html[dir="rtl"] .ser{font-family:var(--ar-display)}

/* ---------------- shell ---------------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr}}

.rail{
  border-inline-end:1px solid var(--rule);background:var(--bone-hi);
  display:flex;flex-direction:column;padding:1.2rem .8rem;position:sticky;top:0;height:100vh;
}
@media(max-width:900px){
  .rail{position:fixed;inset-block:0;inset-inline-start:0;width:var(--rail);z-index:80;
    transform:translateX(-100%);transition:transform .4s var(--ease);box-shadow:0 0 60px rgba(22,52,102,.18)}
  html[dir="rtl"] .rail{transform:translateX(100%)}
  .rail.open{transform:none}
}
.brand{display:flex;align-items:center;gap:.5rem;padding:.2rem .5rem 1.3rem;border-bottom:1px solid var(--rule);margin-bottom:1rem}
.brand .mk{font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:1.35rem}
.brand .dot{width:5px;height:5px;border-radius:50%;background:var(--ember)}
.brand .sub{font-family:var(--mono);font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-faint);margin-inline-start:auto}

.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav .grp{font-family:var(--mono);font-size:.52rem;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-faint);padding:1rem .6rem .4rem}
html[dir="rtl"] .nav .grp{font-family:var(--ar-body);letter-spacing:0;text-transform:none;font-size:.68rem}
.nav button{
  display:flex;align-items:center;gap:.65rem;padding:.55rem .6rem;border-radius:9px;
  font-size:.87rem;color:var(--fg-mute);text-align:start;transition:background .25s,color .25s;
}
.nav button svg{width:15px;height:15px;flex-shrink:0;opacity:.75}
.nav button:hover{background:var(--paper);color:var(--fg)}
.nav button[aria-current="true"]{background:var(--fg);color:var(--bone-hi)}
.nav button[aria-current="true"] svg{opacity:1}
.nav .pill{margin-inline-start:auto;font-family:var(--mono);font-size:.58rem;background:var(--ember-wash);color:var(--ember);padding:.1rem .35rem;border-radius:4px}
.nav button[aria-current="true"] .pill{background:rgba(255,255,255,.16);color:#fff}

.rail-foot{border-top:1px solid var(--rule);padding-top:.9rem;margin-top:.6rem}
.acct{display:flex;align-items:center;gap:.6rem;padding:.4rem .5rem;border-radius:9px}
.acct:hover{background:var(--paper)}
.acct .av{width:30px;height:30px;border-radius:50%;background:var(--fg);color:var(--bone-hi);display:grid;place-items:center;font-size:.72rem;font-weight:600;flex-shrink:0}
.acct .nm{display:block;font-size:.82rem;font-weight:500;line-height:1.3}
.acct .pl{display:block;font-size:.68rem;color:var(--fg-faint);line-height:1.3}

/* ---------------- topbar ---------------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;top:0;z-index:40;background:rgba(238,243,250,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--rule);padding:.85rem clamp(1rem,3vw,2rem);
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
}
.burger{display:none;width:32px;height:32px;border:1px solid var(--rule);border-radius:8px;place-items:center}
@media(max-width:900px){.burger{display:grid}}
.top h1{font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:1.35rem;font-weight:400;line-height:1}
html[dir="rtl"] .top h1{font-family:var(--ar-display);font-size:1.2rem;line-height:1.35}
.top .right{margin-inline-start:auto;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}

.live-chip{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--rule);border-radius:999px;padding:.35rem .7rem;
  font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-mute)}
html[dir="rtl"] .live-chip{font-family:var(--ar-body);letter-spacing:0;text-transform:none;font-size:.72rem}
.live-chip .ld{width:6px;height:6px;border-radius:50%;background:var(--ember);animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.langsel{display:flex;border:1px solid var(--rule);border-radius:999px;padding:2px;position:relative}
.langsel button{padding:.28rem .6rem;border-radius:999px;font-size:.74rem;color:var(--fg-mute);transition:all .3s}
.langsel button[aria-pressed="true"]{background:var(--fg);color:var(--bone-hi)}
.langsel button:nth-child(n+2){font-family:var(--ar-body)}

.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border-radius:999px;
  border:1px solid var(--fg);background:var(--fg);color:var(--bone-hi);font-size:.82rem;font-weight:500;transition:transform .25s var(--ease)}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--fg)}
.btn svg{width:14px;height:14px}

.view{padding:clamp(1.1rem,3vw,2rem);flex:1;display:none;animation:fade .45s var(--ease)}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------------- primitives ---------------- */
.grid{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media(max-width:520px){.g4{grid-template-columns:1fr}}

.stat{background:var(--bone-hi);padding:1.15rem 1.2rem;display:flex;flex-direction:column;gap:.35rem;min-height:118px}
.stat .v{font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:2rem;line-height:1}
.stat .d{font-size:.76rem;color:var(--fg-mute)}
.stat .spark{margin-top:auto;display:flex;align-items:flex-end;gap:2px;height:26px}
.stat .spark i{flex:1;background:var(--fg);opacity:.16;border-radius:1px}
.stat .spark i:last-child{opacity:.85;background:var(--ember)}

.card{background:var(--bone-hi);border:1px solid var(--rule);border-radius:14px;padding:1.2rem 1.25rem}
.card h3{font-size:.92rem;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:.6rem}
.card h3 .more{margin-inline-start:auto;font-size:.75rem;color:var(--fg-mute);font-weight:400}

/* Same minmax(0,…) rule as the calendar grid, and for the same reason: a plain
   1fr track keeps an automatic minimum the size of whatever is inside it, so a
   wide child (the month grid) stretched the column past the screen instead of
   being made to fit. The children get min-width:0 so they can actually shrink. */
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:1rem;margin-top:1rem}
.cols>*{min-width:0}
@media(max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}}

table{width:100%;border-collapse:collapse;font-size:.85rem}
th{font-family:var(--mono);font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--fg-faint);
  text-align:start;padding:.55rem .6rem;border-bottom:1px solid var(--rule);white-space:nowrap;font-weight:400}
html[dir="rtl"] th{font-family:var(--ar-body);letter-spacing:0;text-transform:none;font-size:.7rem}
td{padding:.78rem .6rem;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .2s}
tbody tr:hover{background:var(--paper)}
td.num{font-family:var(--mono);font-size:.78rem;color:var(--fg-mute);white-space:nowrap;direction:ltr}
td .ar{font-family:var(--ar-body);direction:rtl;display:inline-block}
.tw{overflow-x:auto;margin-inline:-.3rem}

.tag{display:inline-flex;align-items:center;gap:.35rem;font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;
  text-transform:uppercase;padding:.2rem .45rem;border-radius:4px;border:1px solid var(--rule);color:var(--fg-mute);white-space:nowrap}
html[dir="rtl"] .tag{font-family:var(--ar-body);letter-spacing:0;text-transform:none;font-size:.7rem}
.tag.on{border-color:var(--fg);color:var(--fg)}
.tag.hot{border-color:rgba(47,107,255,.4);color:var(--ember);background:var(--ember-wash)}
.tag.dim{color:var(--fg-faint)}

.bar{height:4px;background:var(--paper);border-radius:2px;overflow:hidden;min-width:70px}
.bar span{display:block;height:100%;background:var(--fg);border-radius:2px;transition:width .8s var(--ease)}

.rowline{display:flex;align-items:center;gap:.8rem;padding:.78rem 0;border-bottom:1px solid var(--rule-soft)}
.rowline:last-child{border-bottom:none}
.rowline .who{width:28px;height:28px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:.68rem;font-weight:600;color:var(--fg-mute);flex-shrink:0}
.rowline .t1{display:block;font-size:.85rem;font-weight:500;line-height:1.4}
.rowline .t2{display:block;font-size:.74rem;color:var(--fg-faint);margin-top:.15rem;line-height:1.4}
.rowline .end{margin-inline-start:auto;text-align:end}

.empty{padding:2.4rem 1rem;text-align:center;color:var(--fg-faint);font-size:.85rem}


/* script library + knowledge */
.pick{display:flex;gap:.5rem;flex-wrap:wrap}
.pick button{border:1px solid var(--rule);border-radius:10px;padding:.5rem .85rem;font-size:.83rem;color:var(--fg-mute);display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;transition:all .25s;text-align:start}
.pick button:hover{border-color:var(--fg);color:var(--fg)}
.pick button[aria-pressed="true"]{background:var(--fg);color:var(--bone-hi);border-color:var(--fg)}
.pick button .sub{font-size:.66rem;opacity:.65;font-weight:400}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1rem}
@media(max-width:1120px){.vgrid{grid-template-columns:1fr}}
.vcard{background:var(--bone-hi);border:1px solid var(--rule);border-radius:14px;padding:1.05rem;display:flex;flex-direction:column;gap:.75rem;transition:border-color .25s}
.vcard:hover{border-color:var(--fg)}
.vcard .conv{display:flex;flex-direction:column;gap:.5rem;background:var(--paper);border-radius:10px;padding:.85rem .9rem;flex:1}
.vcard .conv p{font-size:.85rem;line-height:1.85;margin:0}
.vcard .conv p[data-by="u"]{color:var(--fg-faint)}
.vcard .conv p .w{font-family:var(--mono);font-size:.5rem;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-faint);display:block;margin-bottom:.05rem}
html[dir="rtl"] .vcard .conv p .w{font-family:var(--ar-body);letter-spacing:0;text-transform:none;font-size:.62rem}
.vcard .conv p.msarab{font-family:var(--ar-body);direction:rtl;text-align:right}
.vcard .conv p.msen{direction:ltr;text-align:left}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
@media(max-width:980px){.kgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.kgrid{grid-template-columns:1fr}}
.kmethod{background:var(--bone-hi);padding:1.05rem 1.1rem;display:flex;flex-direction:column;gap:.4rem;cursor:pointer;text-align:start;transition:background .25s;min-height:148px}
.kmethod:hover{background:var(--paper)}
.kmethod[aria-pressed="true"]{background:var(--fg)}
.kmethod[aria-pressed="true"] .ser{color:var(--bone-hi)}
.kmethod[aria-pressed="true"] .d,.kmethod[aria-pressed="true"] .lbl{color:rgba(255,255,255,.66)}
.kmethod .d{font-size:.76rem;color:var(--fg-mute);line-height:1.65}
.drop{border:1.5px dashed var(--rule);border-radius:12px;padding:2rem 1rem;text-align:center;color:var(--fg-faint);font-size:.85rem;cursor:pointer;transition:all .25s}
.drop:hover{border-color:var(--ember);color:var(--fg-mute);background:var(--ember-wash)}
.prog{display:flex;flex-direction:column;gap:.55rem;padding:.3rem 0}
.prog .st{display:flex;align-items:center;gap:.6rem;font-size:.83rem;color:var(--fg-faint);transition:color .3s}
.prog .st.done{color:var(--fg)}
.prog .st .dotp{width:7px;height:7px;border-radius:50%;background:var(--rule);flex:none;transition:background .3s}
.prog .st.done .dotp{background:var(--ember)}
.menu-ed input{background:var(--bone);border:1px solid var(--rule-soft);border-radius:6px;padding:.28rem .45rem;font:inherit;font-size:.82rem;width:100%}
.menu-ed input.arv{font-family:var(--ar-body);direction:rtl;text-align:right}
.menu-ed input.pr{font-family:var(--mono);width:76px;text-align:end;direction:ltr}
.provpick{display:flex;flex-direction:column;gap:.3rem;margin-top:.2rem}
.provpick button{border:1px solid var(--rule);border-radius:8px;padding:.35rem .6rem;font-size:.76rem;color:var(--fg-mute);text-align:start;transition:all .2s}
.provpick button:hover{border-color:var(--fg);color:var(--fg)}
.scgrid{display:grid;grid-template-columns:1fr 260px;gap:1rem;align-items:end}
@media(max-width:760px){.scgrid{grid-template-columns:1fr}}
summary::-webkit-details-marker{display:none}

/* transcript viewer */
.tr{display:flex;flex-direction:column;gap:.85rem;max-height:420px;overflow-y:auto;padding-inline-end:.3rem}
.tr .ln{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:start}
.tr .ln .w{font-family:var(--mono);font-size:.54rem;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-faint);padding-top:.28rem;white-space:nowrap}
html[dir="rtl"] .tr .ln .w{font-family:var(--ar-body);letter-spacing:0;text-transform:none;font-size:.68rem}
.tr .ln .x{font-family:var(--ar-body);direction:rtl;text-align:right;font-size:.92rem;line-height:1.85}
.tr .ln[data-by="ai"] .x{color:var(--ember)}

/* toggles */
.sw{width:36px;height:20px;border-radius:10px;background:var(--paper);border:1px solid var(--rule);position:relative;transition:background .3s}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:14px;height:14px;border-radius:50%;background:var(--fg-faint);transition:.3s}
.sw[aria-pressed="true"]{background:var(--fg);border-color:var(--fg)}
.sw[aria-pressed="true"]::after{inset-inline-start:18px;background:#fff}

.fld{margin-bottom:.85rem}
.fld label{display:block;font-family:var(--mono);font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;color:var(--fg-faint);margin-bottom:.35rem}
html[dir="rtl"] .fld label{font-family:var(--ar-body);letter-spacing:0;text-transform:none;font-size:.7rem}
.fld input,.fld select,.fld textarea{width:100%;background:var(--bone);border:1px solid var(--rule);border-radius:9px;
  padding:.6rem .75rem;font-family:inherit;font-size:.87rem;color:var(--fg);outline:none;transition:border-color .25s}
.fld textarea{min-height:150px;resize:vertical;line-height:1.7}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--fg)}
.fld.ar textarea,.fld.ar input{font-family:var(--ar-body);direction:rtl;text-align:right}

.seg{display:flex;gap:.35rem;flex-wrap:wrap}
.seg button{padding:.4rem .75rem;border:1px solid var(--rule);border-radius:8px;font-size:.8rem;color:var(--fg-mute);transition:all .25s}
.seg button[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);background:var(--paper);font-weight:600}

.note{font-size:.76rem;color:var(--fg-faint);line-height:1.65;border-top:1px solid var(--rule-soft);padding-top:.9rem;margin-top:1rem}

/* ---- Start here ---- */
.hero-card{background:linear-gradient(135deg,var(--ink) 0%,#1B3D77 58%,#24508F 100%);color:#EEF3FA;border:0}
.hero-card h2,.hero-card p{color:#EEF3FA}
/* the action sits ON the navy card, so it has to be the bright one — the
   default ember button is a navy fill, which disappears into it */
.hero-card .btn-ember{background:#FFFFFF;border-color:#FFFFFF;color:var(--ink);font-weight:600}
.hero-card .btn-ember:hover{background:#DCE6F7;border-color:#DCE6F7;color:var(--ink)}
.hc-top{display:flex;gap:1.6rem;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.hc-greet{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(238,243,250,.66);margin-bottom:.5rem}
html[dir="rtl"] .hc-greet{font-family:inherit;letter-spacing:0;text-transform:none;font-size:.78rem}
.hc-h{font-size:clamp(1.3rem,3.2vw,1.85rem);font-weight:600;line-height:1.2;margin-bottom:.45rem}
.hc-p{font-size:.92rem;color:rgba(238,243,250,.78);max-width:46ch;line-height:1.6}
.hc-ring{
  --p:0;flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(#7FA8FF calc(var(--p)*1%),rgba(238,243,250,.16) 0);
}
.hc-ring::before{content:"";position:absolute;width:72px;height:72px;border-radius:50%;background:#15305C}
.hc-pct{position:relative;font-size:1.22rem;font-weight:600;color:#EEF3FA}
.hc-pct small{font-size:.7rem;opacity:.7;margin-inline-start:1px}
.hc-cta{margin-top:1.3rem}
@media(max-width:620px){.hc-ring{width:72px;height:72px}.hc-ring::before{width:56px;height:56px}.hc-pct{font-size:1rem}}

.steps-card{margin-top:1rem}
.steplist{list-style:none;margin-top:.9rem}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:.95rem;align-items:center;
  padding:.95rem .2rem;border-top:1px solid var(--rule-soft)}
.step:first-child{border-top:0}
.step .sm{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-family:var(--mono);font-size:.72rem;border:1px solid var(--rule);color:var(--fg-faint);background:var(--bone-hi)}
.step.done .sm{background:var(--ok,#1B7A4A);border-color:var(--ok,#1B7A4A);color:#fff}

.recplay{width:100%;height:38px;margin-bottom:1rem;border-radius:8px}

.dest.on .dest-dot{background:var(--ok,#1B7A4A);box-shadow:0 0 0 3px rgba(27,122,74,.16)}

.dest-url code{font-family:var(--mono);font-size:.7rem;background:var(--paper);padding:.35rem .5rem;
  border-radius:4px;word-break:break-all;flex:1;min-width:0;color:var(--fg)}

.scrim{position:fixed;inset:0;background:rgba(22,52,102,.35);z-index:70;opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.open{opacity:1;pointer-events:auto}
@media(min-width:901px){.scrim{display:none}}

.vpanel{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;padding:1rem;
  background:rgba(22,52,102,.4);backdrop-filter:blur(6px)}
.vpanel.open{display:flex}
.vbox{background:var(--bone-hi);border:1px solid var(--rule);border-radius:16px;width:min(560px,100%);

.vbox .vtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.vbox h3{font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:1.5rem;font-weight:400}
.vbox .vlead{font-size:.84rem;color:var(--fg-mute);line-height:1.7;margin-bottom:1.4rem}
.vrow{display:grid;grid-template-columns:26px 1fr;gap:.8rem;padding:.9rem 0;border-top:1px solid var(--rule-soft)}
.vrow .vnum{width:24px;height:24px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;
  font-family:var(--mono);font-size:.6rem;color:var(--fg-mute)}
.vrow.done .vnum{background:var(--fg);border-color:var(--fg);color:var(--bone-hi)}
.vrow .vt{display:block;font-size:.9rem;font-weight:600}

.codebox .ct{font-family:var(--mono);font-size:.68rem;color:var(--fg-faint)}
.codebox .cn{font-family:var(--mono);font-size:.92rem;color:var(--fg);direction:ltr}
.vstatus{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--mono);font-size:.58rem;
  letter-spacing:.13em;text-transform:uppercase;padding:.22rem .5rem;border-radius:5px;margin-top:.6rem}
.vstatus.pend{background:var(--paper);color:var(--fg-mute)}
.vstatus.ok{background:rgba(22,52,102,.06);color:var(--fg)}
.vstatus.bad{background:var(--ember-wash);color:var(--ember)}
.toast{position:fixed;inset-block-end:1.3rem;inset-inline-start:1.3rem;z-index:200;

/* ==== FORCED-DARK HARDENING ====================================
   Some in-app browsers (notably iOS) repaint pages that theme via
   CSS variables. Literal values plus !important cannot be reached
   that way, so the page stays light wherever it is opened. */
html{color-scheme:only light !important;background:#EEF2F9 !important;background-color:#EEF2F9 !important}
body{background:#EEF2F9 !important;background-color:#EEF2F9 !important;color:#163466 !important}
@media (prefers-color-scheme:dark){
  :root{color-scheme:only light !important}
  html,body{background:#EEF2F9 !important;background-color:#EEF2F9 !important;color:#163466 !important}
}
@media (prefers-color-scheme:dark){
  .card,.stat,.topbar,.side,table{background:#FFFFFF !important}
  h1,h2,h3,.ser,.v{color:#163466 !important}
  .lbl,.note{color:#4A5F86 !important}
  .btn{background:#163466 !important;color:#FFFFFF !important}
  .btn.ghost{background:transparent !important;color:#163466 !important}
}

.empty{padding:2.6rem 1.5rem;text-align:center;border:1px dashed var(--rule);border-radius:10px;background:#FFFFFF}
.empty h4{font-size:1.05rem;font-weight:600;margin-bottom:.35rem}
.empty p{color:var(--fg-mute);font-size:.9rem;max-width:44ch;margin-inline:auto}
.empty .btn{margin-top:1rem}
.sample{font-size:.8rem;color:var(--fg-mute);padding:.45rem .8rem;border:1px solid var(--rule);border-radius:99px;display:inline-block;margin-bottom:1rem}
.stag{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:.15rem .5rem;border-radius:99px}
.stag.live{background:rgba(27,122,74,.1);color:#1B7A4A}.stag.draft{background:var(--paper);color:var(--fg-mute)}.stag.paused{background:rgba(47,107,255,.1);color:#2F6BFF}

/* Text fill must follow each element's own colour. Setting it to a fixed value
   on body inherits everywhere and repaints light text on dark buttons black,
   which is invisible. currentColor keeps the forced-dark protection without
   that side effect. */
*,*::before,*::after{-webkit-text-fill-color:currentColor}

/* calendar */
.cal-top{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap;min-width:0}
.cal-top>*{min-width:0}
.cal-top b{font-size:1rem}
/* minmax(0,1fr), not 1fr: a 1fr track keeps an automatic minimum the size of
   its content, so on a narrow phone the seven columns refused to shrink and
   pushed the whole month grid 80px past the screen. */
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;min-width:0}
@media(max-width:430px){.cal-grid{gap:3px}.cal-d{font-size:.76rem;border-radius:6px}}
.cal-d{position:relative;aspect-ratio:1;border:1px solid var(--rule-soft);border-radius:8px;background:#fff;
  cursor:pointer;font-family:var(--body);font-size:.82rem;color:var(--fg);display:grid;place-items:center;padding:0}
.cal-d.out{color:var(--fg-faint);background:transparent;border-color:transparent}
.cal-d.today{border-color:var(--ember)}
.cal-d.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.cal-d i{position:absolute;bottom:5px;inset-inline-end:5px;width:16px;height:16px;border-radius:50%;
  background:var(--ember);color:#fff;font-style:normal;font-size:.58rem;display:grid;place-items:center}
.cal-d.sel i{background:#fff;color:var(--ink)}
.cal-sub{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:1.1rem;padding-top:1rem;
  border-top:1px solid var(--rule-soft);font-size:.82rem;color:var(--fg-mute)}
.cal-sub code{font-family:var(--mono);font-size:.72rem;background:var(--paper);padding:.3rem .5rem;

.bk{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;background:#fff;padding:.75rem .9rem}

.bk .bb{display:flex;flex-direction:column;min-width:0}

  border-radius:50%;background:#2F6BFF}

  border-inline-start:2px solid var(--ember);padding-inline-start:.7rem;line-height:1.5}

.rail .brand{text-decoration:none;color:inherit;display:flex;align-items:center;gap:.5rem}

.firstrun{max-width:46rem;padding:1.6rem 1.8rem}

  border:1px solid var(--rule-soft);border-radius:10px;overflow:hidden;counter-reset:fr}
.fr-steps li{counter-increment:fr;background:#fff;padding:.75rem .95rem;font-size:.9rem;color:var(--fg-mute);
  display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:baseline}
.fr-steps li::before{content:counter(fr);font-family:var(--mono);font-size:.7rem;color:var(--ember)}

.live-chip[hidden]{display:none}
.firstrun .btn-ember{background:var(--ember-mid);border-color:var(--ember-mid);color:#fff}

function go(k){ view=k; $$(".view").forEach(v=> v.classList.toggle("on", v.dataset.view===k));
  /* these two read live state, so they are re-fetched on entry rather than
     showing whatever was true when the page loaded */
  if(k==="navStart" && typeof loadSteps==="function" && typeof REAL!=="undefined" && REAL){ loadSteps().then(vStart); }
  if(k==="routes"   && typeof loadDest==="function"  && typeof REAL!=="undefined" && REAL){ loadDest().then(vRoutes); }
  $("#viewTitle").textContent=t(k); renderNav(); }

const escP = v => String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function planCard(){
  const t=(window.NABRA_BOOT||{}).tenant||{};

  const live = t.status==="active";

  const used = Number(t.minutes_used||0);
  return `
  <div class="card plancard">
    <div class="pc-main">
      <span class="pc-k">${tt("yourPlan")}</span>
      <b class="pc-plan">${escP(plan)||"—"} <span class="pc-cyc">${cycle}</span></b>

    </div>
    ${warn && (!live || t.email_verified===false) ? `<p class="pc-warn">${warn}</p>` : ""}
  </div>`;
}
function tt(k){ try{ return t(k); }catch(_){ return k; } }

function vRoutes(){

  $("#v-routes").innerHTML=`

    <p style="font-size:.86rem;color:var(--fg-mute);line-height:1.7;max-width:78ch">${t("rtLead")}</p>

  <div class="card">
    <h3>${t("rtDest")}<span class="more">${t("rtDestL")}</span></h3>
    <div class="grid g3" style="margin-top:.4rem">
      ${DESTS.map(d=>{
        const hasProv=!!PROVS[d.k];
        return `
        <div class="stat" style="gap:.5rem;min-height:172px">
          <span class="lbl">${d.on?t("connected"):"—"}</span>
          <span class="ser" style="font-size:1.2rem">${dName(d.k)}</span>
          <span class="d" style="line-height:1.6">${t("d"+d.k.charAt(0).toUpperCase()+d.k.slice(1)+"D")}</span>
          ${d.on&&hasProv?`<span class="tag on" style="align-self:flex-start">${t("via")} ${t(DPROV[d.k])}</span>`:""}
          ${provPick===d.k?`
            <span class="lbl" style="margin-top:.2rem">${t("pickProv")}</span>
            <span class="provpick">${PROVS[d.k].map(pk=>`<button data-prov="${d.k}" data-pv="${pk}">${t(pk)}</button>`).join("")}</span>`
          :`<button class="btn ${d.on?"ghost":""}" style="margin-top:auto;align-self:flex-start;padding:.34rem .8rem;font-size:.77rem"
            data-dest="${d.k}">${d.on?t("disconnect"):t("connect")}</button>`}
        </div>`}).join("")}
    </div>
  </div>

  <div class="card">
    <h3>${t("rtRules")}<span class="more">${t("rtRulesL")}</span></h3>
    ${RULES.map((r,i)=>`
      <div class="rowline" style="align-items:flex-start;gap:1rem;flex-wrap:wrap">
        <span style="flex:1;min-width:240px">
          <span class="t2">${t("rtWhen")}</span>
          <span style="display:block;margin:.3rem 0 .5rem">${outTag(r.when)}</span>
          <span class="t2">${t("rtThen")}</span>
          <span style="display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.35rem">
            ${DESTS.map(d=>{
              const active=r.dest.includes(d.k);
              return `<button class="tag ${active?"on":"dim"}" data-rule="${i}" data-dk="${d.k}"
                style="cursor:pointer;${d.on?"":"opacity:.45"}">${dName(d.k)}</button>`;
            }).join("")}
          </span>
          ${r.dest.length?"":`<span class="t2" style="color:var(--ember);margin-top:.4rem;display:block">${t("rtNone")}</span>`}
        </span>
        <span class="end" style="display:flex;align-items:center;gap:.6rem">
          <span class="t2">${r.on?t("rtOn"):t("rtOff")}</span>
          <button class="sw" data-ron="${i}" aria-pressed="${r.on}"></button>
        </span>
      </div>`).join("")}
  </div>

  <div class="cols">
    <div class="card">
      <h3>${t("rtFields")}<span class="more">${t("rtFieldsL")}</span></h3>
      <div class="tw"><table>
        <tbody>${FIELDS.map(f=>`<tr><td>${t(f)}</td><td style="text-align:end;color:var(--fg-faint)">auto</td></tr>`).join("")}</tbody>
      </table></div>
    </div>
    <div class="card" style="height:fit-content">
      <h3>${t("rtTest")}</h3>
      <p style="font-size:.83rem;color:var(--fg-mute);line-height:1.65;margin-bottom:1rem">${t("rtTestD")}</p>
      <button class="btn" style="width:100%;justify-content:center" id="rtTestBtn">${t("rtTest")}</button>
      <p class="note">${t("noWire")}</p>
    </div>
  </div>`;

  $$("[data-dest]").forEach(b=> b.addEventListener("click",()=>{
    const d=DESTS.find(x=>x.k===b.dataset.dest);
    if(!d.on && PROVS[d.k]){ provPick=d.k; vRoutes(); return; }      // pick the provider before connecting
    d.on=!d.on;
    if(!d.on) RULES.forEach(r=> r.dest=r.dest.filter(k=>k!==d.k));   // a disconnected destination cannot stay in a rule
    vRoutes(); toast(t("saved"));
  }));
  $$("[data-prov]").forEach(b=> b.addEventListener("click",()=>{
    const d=DESTS.find(x=>x.k===b.dataset.prov);
    DPROV[d.k]=b.dataset.pv; d.on=true; provPick=null;
    vRoutes(); toast(t("connected")+" — "+t(b.dataset.pv));
  }));
  $$("[data-rule]").forEach(b=> b.addEventListener("click",()=>{
    const r=RULES[+b.dataset.rule], k=b.dataset.dk;
    const d=DESTS.find(x=>x.k===k);
    if(!d.on){ toast(t("connect")+" — "+dName(k)); return; }
    r.dest = r.dest.includes(k) ? r.dest.filter(x=>x!==k) : r.dest.concat(k);
    vRoutes();
  }));

/* Account plan + cycle. Overwritten by NABRA_BOOT when served at /app;
   PLANS is pulled from the gateway (/api/pricing) so prices stay in
   lockstep with what checkout actually charges. */
let ACCT = { plan:"growth", cycle:"monthly" };
let PLANS = { plans:{ starter:49, growth:129, enterprise:399 }, annualMonthsFree:2 }; // fallback for standalone preview
let FXR = null; // billing rate from /api/fx/current, if reachable
(async ()=>{ try{
  const r = await fetch("/api/pricing"); if(r.ok){ PLANS = await r.json(); }
}catch(_){}
 try{
  const r = await fetch("/api/fx/current"); if(r.ok){ FXR = await r.json(); }
}catch(_){}
 vBilling();
})();
const fmt$ = v => v==null ? "—" : "$"+Math.round(v).toLocaleString();
const fmtE = v => (FXR && v!=null) ? "E£"+(Math.ceil(v*(FXR.billingRate||FXR.liveBuffered)/5)*5).toLocaleString() : "";

 vA:{eg:"ادخل في الموضوع بسرعة واطلب من بدري.",en:"Get to the point fast and ask early."},

function scBiz(l){ return sc.biz.trim() || (l==="eg"?"مطعمك":"your business"); }
function scLines(v){
  const l=sc.slang, C=SC[sc.cat][l], K=TK[sc.tone][l], g=sc.goal;
  const biz=scBiz(l), fill=x=>x.replace("{biz}",biz);
  const A=x=>({by:"ai",x:fill(x)}), U=x=>({by:"u",x});
  const pushy = (sc.tone==="tCloser"||g==="gSell") ? [A(K.push)] : [];
  if(v==="vA") return [A(K.open+" "+C.greet),U(CLN[g][l]),A(C.core[g]),A(C.ask[g]),...pushy,A(K.close)];
  if(v==="vB") return [A(K.open+" "+C.greet),U(CLN[g][l]),A(C.disc[0]),A(C.disc[1]+" "+C.core[g]),A(C.ask[g]),A(K.close)];
  return [A(K.open+" "+C.greet+" "+C.offer),U(CLN[g][l]),A(C.core[g]),A(C.ask[g]),...pushy,A(K.close)];
}
function scInstr(v){
  const l=sc.slang, C=SC[sc.cat][l], K=TK[sc.tone][l], g=sc.goal, biz=scBiz(l);
  const bits = l==="eg"
    ? [C.who+" اسمه "+biz+".","اتكلم بنبرة "+K.style+".",C.instr[g],SVARS[v].eg,C.extra,"لو المتصل طلب موظف حوّله فوراً."]
    : [C.who+" called "+biz+".","Speak in a tone that is "+K.style+".",C.instr[g],SVARS[v].en,C.extra,"If the caller asks for a person, transfer immediately."];

let REAL=null;
/* Everything below renders data that ultimately comes from callers — a lead
   name is whatever someone said on the phone. It is escaped before it
   touches the DOM, without exception. */
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const empty=(h,p,btn)=>`<div class="empty"><h4>${t(h)}</h4><p>${t(p)}</p>${btn?`<a class="btn" href="/setup">${t(btn)}</a>`:""}</div>`;

/* ============================================================
   START HERE
   ------------------------------------------------------------
   The first thing a customer sees after signing in, until they
   are live. Landing straight in the console showed somebody
   with no agent a grid of zeros and left them to work out what
   to do with it.

   Every row's state comes from the server, which is the only
   place that can see the agent, the provisioning queue and the
   call history at once. Two steps are deliberately not clickable
   — connecting the line is our job, and the first call is the
   customer's customers' — so nobody is sent somewhere they
   cannot act.
   ============================================================ */
let STEPS = null;

/* titles and blurbs come from the dictionaries, like everything else here */
const stepCopy = k => [t("st."+k+"T"), t("st."+k+"B")];

async function loadSteps(){
  try{
    const r = await fetch("/api/me/next-steps",{headers:{accept:"application/json"}});
    STEPS = r.ok ? await r.json() : null;
  }catch(_){ STEPS=null; }
}

function vStart(){
  const box=$("#v-start"); if(!box) return;
  if(!STEPS){ box.innerHTML = `<div class="empty"><h4>Could not load your progress</h4>
    <p>Reload the page and it should come back.</p></div>`; return; }

  const d=STEPS;
  /* the next thing THEY can do, which is not always the next undone step */
  const nextIdx = d.steps.findIndex(s=>!s.done && !s.waiting && s.go);
  const name = (window.NABRA_BOOT && window.NABRA_BOOT.tenant && window.NABRA_BOOT.tenant.name) || "";
  const hour = new Date().getHours();
  const greet = t(hour<12 ? "sh.greetAm" : hour<18 ? "sh.greetPm" : "sh.greetEve");

  box.innerHTML = `
  <div class="card hero-card">
    <div class="hc-top">
      <div>
        <p class="hc-greet">${greet}${name?`, ${esc(name.split(" ")[0])}`:""}</p>
        <h2 class="hc-h">${d.live ? t("sh.liveH") : t("sh.todoH")}</h2>
        <p class="hc-p">${d.live ? t("sh.liveP")
          : t("sh.todoP").replace("{d}",d.done).replace("{t}",d.total)}</p>
      </div>
      <div class="hc-ring" style="--p:${d.pct}">
        <span class="hc-pct">${d.pct}<small>%</small></span>
      </div>
    </div>
    ${nextIdx>=0 && d.steps[nextIdx].go ? `
      <a class="btn btn-ember hc-cta" href="${d.steps[nextIdx].go}">
        ${esc(stepCopy(d.steps[nextIdx].k)[0])} →</a>` : ``}
  </div>

  <div class="card steps-card">
    <h3>${t("sh.what")}</h3>
    <ol class="steplist">
      ${d.steps.map((s,i)=>{
        const [title,blurb] = stepCopy(s.k);
        /* "waiting" outranks "now": connecting the line is our job, so showing it
           as the customer's next action would be telling them to do something
           they cannot do. */
        const state = s.done ? "done" : (s.waiting ? "wait" : (i===nextIdx ? "now" : "later"));
        const mark = s.done ? "✓" : (state==="wait" ? "…" : String(i+1));
        return `<li class="step ${state}">
          <span class="sm">${mark}</span>
          <span class="sb">
            <b>${esc(title)}</b>
            <small>${esc(blurb)}</small>
            ${state==="wait" ? `<em class="swait">${t("sh.queued")}</em>` : ``}
          </span>
          ${s.go && !s.done ? `<a class="btn ghost sgo" href="${s.go}">${i===nextIdx?t("sh.start"):t("sh.open")}</a>`
            : s.done ? `<span class="sdone">${t("sh.done")}</span>` : `<span class="slater"></span>`}
        </li>`;
      }).join("")}
    </ol>
  </div>`;
}

        : x.key==="whatsapp" && on

              x.delivered && (x.delivered.sent||x.delivered.failed)
                ? ` · ${x.delivered.sent} sent${x.delivered.failed?`, ${x.delivered.failed} failed`:""}` : ""}</p>`
        : (x.key==="transfer"||x.key==="orders") && on
          ? `<p class="dest-meta">${t("wg.onFor")} ${x.agents.map(esc).join(", ")}</p>`
        : x.key==="dashboard"
          ? `<p class="dest-meta">${esc(t("d.calls").replace("{n}", Number(x.calls)||0))}</p>` : ``;
      const off = DEST_KEY[x.key] ? t("d."+DEST_KEY[x.key]+"Off") : "";
      return `<div class="dest ${on?"on":"off"}">
        <div class="dest-h">
          <span class="dest-dot"></span>
          <b>${esc(title)}</b>
          <span class="tag ${on?"ok":"dim"}">${on?t("wg.on"):t("wg.off")}</span>
        </div>
        <p class="dest-b">${esc(blurb)}</p>
        ${on ? extra : `<p class="dest-meta off">${esc(off)}</p>`}
        <span class="dest-carries">${esc(carries)}</span>
      </div>`;
    }).join("")}
  </div>
  <p class="note">${t("wg.foot")}</p>`;

  const cp=$("[data-copycal]");
  if(cp) cp.addEventListener("click",async()=>{
    const u=$("#calUrl"); if(!u) return;
    try{ await navigator.clipboard.writeText(u.textContent); toast(t("wg.copied")); }
    catch(_){ toast("Select the link and copy it."); }
  });
}

/* ============================================================
   OUTBOUND — THE CUSTOMER'S VIEW OF IT
   ------------------------------------------------------------
   One agent's call list: who is waiting, who was reached, and
   what came of it. The agent does the dialling; this is where
   the owner adds people and reads the results.

   When nothing is dialling, this screen says why in the same
   words the server used, rather than showing a list that
   quietly never moves.
   ============================================================ */
let OB = { agentId:null, data:null, busy:false };

async function obLoad(agentId){
  OB.agentId = agentId;
  try{
    const r = await fetch(`/api/me/agents/${agentId}/outbound`,{headers:{accept:"application/json"}});
    OB.data = r.ok ? await r.json() : null;
  }catch(_){ OB.data=null; }
  vCampaigns();
}

function obFmt(d){ return d ? new Date(d).toLocaleString() : "—"; }

const OB_STATE = {
  waiting:  ["dim","Waiting"],
  calling:  ["on","Calling now"],
  done:     ["ok","Reached"],
  failed:   ["no","Could not reach"],
  cancelled:["dim","Cancelled"],
};

function vCampaignsReal(){
  const box=$("#v-campaigns");
  const outbound = REAL.agents.filter(a=>a.direction==="outbound");

  if(!REAL.agents.length){
    box.innerHTML = empty("fr1h","fr1p","fr1cta"); return;
  }
  if(!outbound.length){
    box.innerHTML = `<div class="empty"><h4>No agent is set to make calls</h4>
      <p>An agent either answers your line or calls out on it. Set one to outbound in setup, give it a
      script, and its call list appears here.</p>
      <a class="btn" href="/setup">Open setup</a></div>`;
    return;
  }

  const agent = outbound.find(a=>String(a.id)===String(OB.agentId)) || outbound[0];
  if(String(agent.id)!==String(OB.agentId)){ obLoad(agent.id); return; }

  const d = OB.data;
  if(!d){ box.innerHTML = `<div class="empty"><h4>Could not load the call list</h4><p>Reload the page and it should come back.</p></div>`; return; }

  const c = d.counts||{}, s = d.settings||{};
  const total = Object.values(c).reduce((a,b)=>a+b,0);
  const reached = (c.done||0);
  const pct = total ? Math.round((reached + (c.failed||0) + (c.cancelled||0)) / total * 100) : 0;
  const paused = s.paused !== false;
  const days = Array.isArray(s.days)?s.days:[0,1,2,3,4,6];
  const DAYN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  box.innerHTML = `
  ${outbound.length>1 ? `<div class="seg" style="margin-bottom:1rem">
    ${outbound.map(a=>`<button data-obagent="${a.id}" aria-pressed="${String(a.id)===String(agent.id)}">${esc(a.name)}</button>`).join("")}
  </div>`:""}

  ${d.blockers.length ? `<div class="card" style="border-color:#C9A227;background:rgba(201,162,39,.06)">
    <h3 style="margin-bottom:.4rem">Nothing is being dialled</h3>
    <ul style="margin:.3rem 0 0 1.1rem;color:var(--fg-mute);font-size:.9rem;line-height:1.8">
      ${d.blockers.map(x=>`<li>${esc(x)}</li>`).join("")}
    </ul>
  </div>` : `<div class="card" style="border-color:var(--ok);background:var(--ok-wash)">
    <h3 style="margin-bottom:.3rem">The agent is calling</h3>
    <p class="note" style="margin:0">Working through the list between ${esc(s.from||"10:00")} and ${esc(s.to||"18:00")}, ${
      (s.concurrency||1)>1 ? `up to ${s.concurrency} calls at a time` : "one call at a time"}.</p>
  </div>`}

  <div class="grid g4" style="margin-top:1rem">
    <div class="stat"><span class="lbl">Waiting</span><span class="v">${c.waiting||0}</span></div>
    <div class="stat"><span class="lbl">Calling now</span><span class="v">${c.calling||0}</span></div>
    <div class="stat"><span class="lbl">Reached</span><span class="v">${reached}</span></div>
    <div class="stat"><span class="lbl">Could not reach</span><span class="v">${c.failed||0}</span></div>
  </div>

  <div class="cols" style="margin-top:1rem">
    <div class="card">
      <h3>Add people to call</h3>
      <p class="note" style="margin-bottom:.7rem">One person per line. Put the name and the phone number on
      the same line, in whichever order, and anything after that is a note the agent is given for that call.
      Someone already waiting is not added twice.</p>
      <textarea id="obPaste" rows="7" placeholder="Mona Hassan, +20 100 123 4567, asked about the Sokhna plots&#10;+20 101 222 3333, Ahmed, wants 5000 sqm"
        style="width:100%;font:inherit;font-size:.88rem;line-height:1.6;padding:.75rem;border:1px solid var(--rule);
               border-radius:4px;background:transparent;color:inherit;resize:vertical"></textarea>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:.8rem">
        <button class="btn btn-ember" id="obAdd">Add to the list</button>
        ${(c.waiting||0) ? `<button class="btn ghost" id="obClear">Cancel the ${c.waiting} still waiting</button>`:""}
      </div>
    </div>

    <div class="card">
      <h3>When it may call</h3>
      <p class="note" style="margin-bottom:.8rem">Cairo time. Outside these hours the list simply waits.</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.7rem">
        <div><label class="lbl" for="obFrom">From</label>
          <input id="obFrom" type="time" value="${esc(s.from||"10:00")}" style="width:100%;padding:.55rem;border:1px solid var(--rule);border-radius:4px;background:transparent;color:inherit;font:inherit"></div>
        <div><label class="lbl" for="obTo">Until</label>
          <input id="obTo" type="time" value="${esc(s.to||"18:00")}" style="width:100%;padding:.55rem;border:1px solid var(--rule);border-radius:4px;background:transparent;color:inherit;font:inherit"></div>
      </div>
      <div style="display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.8rem">
        <div class="seg">${DAYN.map((n,i)=>`<button type="button" class="obday" data-d="${i}" aria-pressed="${days.includes(i)}">${n}</button>`).join("")}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.9rem">
        <div><label class="lbl" for="obConc">Calls at once</label>
          <input id="obConc" type="number" min="1" max="10" value="${Number(s.concurrency)||1}" style="width:100%;padding:.55rem;border:1px solid var(--rule);border-radius:4px;background:transparent;color:inherit;font:inherit"></div>
        <div><label class="lbl" for="obTries">Tries per person</label>
          <input id="obTries" type="number" min="1" max="5" value="${Number(s.max_attempts)||2}" style="width:100%;padding:.55rem;border:1px solid var(--rule);border-radius:4px;background:transparent;color:inherit;font:inherit"></div>
      </div>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem">
        <button class="btn ${paused?"btn-ember":"ghost"}" id="obToggle">${paused?"Start calling":"Pause calling"}</button>
        <button class="btn ghost" id="obSave">Save the hours</button>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:1rem;padding-top:1rem">
    <h3>The list${total?` <span style="font-weight:400;color:var(--fg-faint);font-size:.8rem">· ${pct}% worked through</span>`:""}</h3>
    ${d.queue.length ? `<div class="tw"><table>
      <thead><tr><th>Who</th><th>Number</th><th>State</th><th>Tries</th><th>What happened</th><th></th></tr></thead>
      <tbody>${d.queue.map(r=>{
        const st = OB_STATE[r.status] || ["dim", r.status];
        return `<tr>
          <td style="font-weight:500">${esc(r.name)||"—"}${r.note?`<span class="t2" style="display:block;font-weight:400">${esc(r.note)}</span>`:""}</td>
          <td class="mono">${esc(r.phone)}</td>
          <td><span class="tag ${st[0]}">${st[1]}</span></td>
          <td class="num">${r.attempts}</td>
          <td class="t2">${esc(r.summary || r.last_error || r.outcome || (r.status==="waiting"?"Not called yet":""))}</td>
          <td style="text-align:end">${r.status==="waiting"
            ? `<button class="btn ghost" style="padding:.3rem .65rem;font-size:.76rem" data-obcancel="${r.id}">Cancel</button>`:""}</td>
        </tr>`;}).join("")}</tbody>
    </table></div>` : `<p class="note">Nobody on the list yet. Paste some people in above and the agent starts working through them.</p>`}
  </div>`;

  /* ---- wiring ---- */
  $$("[data-obagent]").forEach(b=>b.addEventListener("click",()=>obLoad(b.dataset.obagent)));

  const patch = async body => {
    const r = await fetch(`/api/me/agents/${agent.id}/outbound`,{method:"PATCH",
      headers:{"content-type":"application/json"}, body:JSON.stringify(body)});
    if(!r.ok){ toast("Could not save that."); return null; }
    return r.json();
  };

  const dayBtns = $$(".obday");
  dayBtns.forEach(b=>b.addEventListener("click",()=>{
    b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")==="true" ? "false" : "true");
  }));
  const chosenDays = () => dayBtns.filter(b=>b.getAttribute("aria-pressed")==="true").map(b=>Number(b.dataset.d));

  const saveBtn=$("#obSave");
  if(saveBtn) saveBtn.addEventListener("click", async ()=>{
    const days=chosenDays();
    if(!days.length){ toast("Pick at least one day."); return; }
    const r = await patch({ from:$("#obFrom").value, to:$("#obTo").value, days,
                            concurrency:$("#obConc").value, max_attempts:$("#obTries").value });
    if(r){ toast("Saved."); obLoad(agent.id); }
  });

  const tog=$("#obToggle");
  if(tog) tog.addEventListener("click", async ()=>{
    const r = await patch({ paused: !paused });
    if(r){ toast(paused ? "Calling started." : "Calling paused."); obLoad(agent.id); }
  });

  const add=$("#obAdd");
  if(add) add.addEventListener("click", async ()=>{
    const text=$("#obPaste").value.trim();
    if(!text){ toast("Paste some people in first."); return; }
    if(OB.busy) return; OB.busy=true;
    const was=add.textContent; add.disabled=true; add.textContent="Adding…";
    try{
      const r=await fetch(`/api/me/agents/${agent.id}/outbound`,{method:"POST",
        headers:{"content-type":"application/json"}, body:JSON.stringify({text})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){ toast(j.error||"Could not add those."); }
      else{
        $("#obPaste").value="";
        toast(j.skipped ? `${j.added} added, ${j.skipped} already on the list.` : `${j.added} added.`);
        obLoad(agent.id);
      }
    } finally { OB.busy=false; add.disabled=false; add.textContent=was; }
  });

  const clr=$("#obClear");
  if(clr) clr.addEventListener("click", async ()=>{
    if(!confirm("Cancel everyone still waiting? People already called are not affected.")) return;
    const r=await fetch(`/api/me/agents/${agent.id}/outbound/clear`,{method:"POST"});
    if(r.ok){ const j=await r.json(); toast(`${j.cancelled} cancelled.`); obLoad(agent.id); }
    else toast("Could not do that.");
  });

  $$("[data-obcancel]").forEach(b=>b.addEventListener("click", async ()=>{
    const r=await fetch(`/api/me/outbound/${b.dataset.obcancel}/cancel`,{method:"POST"});
    if(r.ok){ obLoad(agent.id); } else toast("Already being called, so it cannot be cancelled.");
  }));
}

/* ============================================================
   BOOKINGS
   ------------------------------------------------------------
   A month grid beside the day it is showing. Not a scheduling
   product: the agent creates the bookings, this is where the
   owner reads them, confirms them, and subscribes to them from
   whatever calendar they already use.
   ============================================================ */
let BOOK={rows:[],url:"",month:new Date(),day:new Date()};
const dkey = d => new Date(d).toISOString().slice(0,10);
const STATUS_T = {requested:"Requested",booked:"Booked",confirmed:"Confirmed",cancelled:"Cancelled",done:"Done",noshow:"No show"};

async function loadBookings(){
  try{
    const from=new Date(BOOK.month.getFullYear(),BOOK.month.getMonth()-1,1).toISOString();
    const to  =new Date(BOOK.month.getFullYear(),BOOK.month.getMonth()+2,0).toISOString();
    const r=await fetch(`/api/me/bookings?from=${from}&to=${to}`);
    if(!r.ok) return false;
    const d=await r.json();
    BOOK.rows=d.bookings||[]; BOOK.url=d.calendarUrl||"";
    return true;
  }catch(_){ return false; }
}

function vBookings(){
  const el=$("#v-bookings"); if(!el) return;
  if(!REAL){ el.innerHTML=empty("bkNoneH","bkNoneP"); return; }

  const m=BOOK.month, y=m.getFullYear(), mo=m.getMonth();
  const first=new Date(y,mo,1), start=new Date(first);
  start.setDate(1-((first.getDay()+6)%7));            // weeks begin Monday
  const byDay={};
  BOOK.rows.forEach(b=>{ (byDay[dkey(b.starts_at)] ||= []).push(b); });

  let cells="";
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const k=dkey(d), n=(byDay[k]||[]).length;
    const hasReq=(byDay[k]||[]).some(x=>x.outside_hours);
    const cls=[ d.getMonth()!==mo?"out":"", k===dkey(new Date())?"today":"", k===dkey(BOOK.day)?"sel":"", hasReq?"req":"" ].filter(Boolean).join(" ");
    cells+=`<button class="cal-d ${cls}" data-day="${k}"><span>${d.getDate()}</span>${n?`<i>${n}</i>`:""}</button>`;
  }

  const list=(byDay[dkey(BOOK.day)]||[]).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
  const dayLabel=BOOK.day.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});

  el.innerHTML=`
  <div class="cols">
    <div class="card">
      <div class="cal-top">
        <button class="more" id="mPrev" aria-label="Previous month">‹</button>
        <b>${m.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</b>
        <button class="more" id="mNext" aria-label="Next month">›</button>
        <button class="btn ghost" id="mToday" style="margin-inline-start:auto">${t("bkToday")}</button>
      </div>
      <div class="cal-grid">${cells}</div>
      ${(()=>{ const n=BOOK.rows.filter(x=>x.outside_hours).length;
         return n? `<p class="oh-note">${t("bkOutsideNote").replace("{n}",n)}</p>` : ""; })()}
      ${BOOK.url?`<div class="cal-sub">
        <span>${t("bkSub")}</span>
        <code id="calUrl">${esc(BOOK.url)}</code>
        <button class="btn ghost" id="calCopy">${t("bkCopy")}</button>
      </div>`:""}
    </div>

    <div class="card">
      <h3>${esc(dayLabel)}</h3>
      ${list.length? `<div class="daylist">${list.map(b=>`
        <div class="bk" data-bk="${Number(b.id)}">
          <span class="bt">${new Date(b.starts_at).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</span>
          <span class="bb">
            <span class="t1">${esc(b.name)||"—"}${b.party?` · ${Number(b.party)}`:""}${b.outside_hours?` <i class="oh">${t("bkOutside")}</i>`:""}</span>
            <span class="t2">${esc(b.service)||""}${b.agent_name?` · ${esc(b.agent_name)}`:""}${b.phone?` · ${esc(b.phone)}`:""}</span>
          </span>
          <select class="bst" data-bkid="${Number(b.id)}">
            ${Object.keys(STATUS_T).map(k=>`<option value="${k}"${b.status===k?" selected":""}>${STATUS_T[k]}</option>`).join("")}
          </select>
        </div>`).join("")}</div>`
       : `<p class="note" style="margin-top:.8rem">${t("bkNoDay")}</p>`}
    </div>
  </div>`;

  $("#mPrev").onclick=()=>{ BOOK.month=new Date(y,mo-1,1); loadBookings().then(vBookings); };
  $("#mNext").onclick=()=>{ BOOK.month=new Date(y,mo+1,1); loadBookings().then(vBookings); };
  $("#mToday").onclick=()=>{ BOOK.month=new Date(); BOOK.day=new Date(); loadBookings().then(vBookings); };
  $$("#v-bookings .cal-d").forEach(b=>b.onclick=()=>{ BOOK.day=new Date(b.dataset.day+"T12:00:00"); vBookings(); });
  const cp=$("#calCopy");
  if(cp) cp.onclick=async()=>{ try{ await navigator.clipboard.writeText(BOOK.url); cp.textContent=t("bkCopied"); }catch(_){ } };
  $$("#v-bookings .bst").forEach(sel=>sel.onchange=async()=>{
    const id=sel.dataset.bkid, prev=BOOK.rows.find(x=>String(x.id)===String(id));
    try{
      const r=await fetch("/api/me/bookings/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({status:sel.value})});
      if(!r.ok) throw 0;
      if(prev) prev.status=sel.value;
    }catch(_){ if(prev) sel.value=prev.status; }   // put it back rather than lie
  });
}

/* ---- orders: what the agent took on the phone, and where it goes next ---- */
const ORDER_T={new:"New",accepted:"Accepted",out:"Out for delivery",delivered:"Delivered",cancelled:"Cancelled"};
let ORDERS=[];
async function loadOrders(){
  try{ const r=await fetch("/api/me/orders"); if(!r.ok) return false;
       ORDERS=(await r.json()).orders||[]; return true; }catch(_){ return false; }
}
function vOrders(){
  const el=$("#v-orders"); if(!el) return;
  if(!REAL || !ORDERS.length){ el.innerHTML=empty("odNoneH","odNoneP"); return; }
  el.innerHTML=`<div class="card"><div class="tw"><table>
    <thead><tr><th>${t("bkWhen")}</th><th>${t("bkWho")}</th><th>${t("odItems")}</th><th>${t("odAddr")}</th><th>${t("bkStatus")}</th></tr></thead>
    <tbody>${ORDERS.map(o=>`<tr>
      <td class="mono">${esc(new Date(o.created_at).toLocaleString())}</td>
      <td>${esc(o.name)||"—"}<br><span class="t2 mono">${esc(o.phone)}</span></td>
      <td>${esc(o.items)||"—"}${o.total?`<br><span class="t2">${esc(o.total)}</span>`:""}</td>
      <td>${esc(o.address)||"—"}</td>
      <td><select class="bst" data-odid="${Number(o.id)}">
        ${Object.keys(ORDER_T).map(k=>`<option value="${k}"${o.status===k?" selected":""}>${ORDER_T[k]}</option>`).join("")}
      </select></td></tr>`).join("")}</tbody>
  </table></div></div>`;
  $$("#v-orders .bst").forEach(sel=>sel.onchange=async()=>{
    const o=ORDERS.find(x=>String(x.id)===sel.dataset.odid);
    try{
      const r=await fetch("/api/me/orders/"+sel.dataset.odid,{method:"PATCH",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({status:sel.value})});
      if(!r.ok) throw 0; if(o) o.status=sel.value;
    }catch(_){ if(o) sel.value=o.status; }   // revert rather than show a state that did not save
  });
}

(async()=>{
  if(!window.NABRA_BOOT) return;
  try{
    const [c,a,l]=await Promise.all([fetch("/api/me/calls"),fetch("/api/me/agents"),fetch("/api/me/leads")]);
    if(!c.ok||!a.ok||!l.ok) return;
    REAL={calls:(await c.json()).calls||[],agents:(await a.json()).agents||[],leads:(await l.json()).leads||[]};
    await loadBookings(); await loadOrders();
    /* every count on screen now comes from this tenant's own data */
    const pill=document.querySelector('.nav [data-k="calls"] .pill');
    if(pill){ if(REAL.calls.length) pill.textContent=REAL.calls.length; else pill.remove(); }
    const lc=$("#liveCount"); if(lc) lc.textContent = REAL.calls.length ? (0+" "+t("live")) : "";
    const chip=document.querySelector(".live-chip"); if(chip && !REAL.calls.length) chip.hidden=true;
    await loadSteps(); await loadDest();
    vStart();
    vOverview(); vAgents(); vLeads(); vCalls(); vBookings(); vOrders(); vScripts(); vKnowledge(); vCampaigns(); vRecordings(); vRoutes(); vNumbers();

    /* Where to put somebody who has just signed in. Until their line is
       carrying calls there is nothing for an overview to show, so they land on
       the step they are actually on. Once they are live, the console is the
       right place and this never fires again. */
    if(STEPS && !STEPS.live && view==="overview"){ go("navStart"); }
    else { const n=document.querySelector('#nav [data-v="navStart"]'); if(n && STEPS && STEPS.live) n.classList.add("muted"); }
  }catch(_){}
})();

if(window.NABRA_BOOT){ try{
  const b=window.NABRA_BOOT;
  if(b.tenant){
    $("#acctName").textContent = b.tenant.name || "";
    $("#acctPlan").textContent = b.tenant.plan ? (b.tenant.plan.charAt(0).toUpperCase()+b.tenant.plan.slice(1)+" plan") : "";
    if(b.tenant.plan)  ACCT.plan  = b.tenant.plan;
    if(b.tenant.cycle) ACCT.cycle = b.tenant.cycle;
    vBilling();
    const av=document.querySelector(".acct .av");
    if(av && b.tenant.name) av.textContent = b.tenant.name.trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  }
  if(b.lang) applyLang(b.lang);
}catch(_){}}
